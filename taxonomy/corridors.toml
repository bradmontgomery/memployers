# Taxonomy data loaded by the memployers package (src/memployers/taxonomy.py). Edit by hand.
# Memphis-area corridors. A company's `sub_market_corridor` text is lower-cased and checked against
# `overrides` first, then each corridor's `match` substrings in order; no match falls back to `default`.

default = "east_memphis"

[[overrides]]
contains = "downtown & east memphis"
corridor = "east_memphis"

