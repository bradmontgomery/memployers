# Taxonomy data loaded by the memployers package (src/memployers/taxonomy.py). Edit by hand.
# Skill categories (display order) and the canonical skills matched in job titles and tech-stack tags.
# Patterns are Python regexes, matched against lower-cased text. Use 'literal strings' so backslashes survive.

[[categories]]
name = "Languages & Frameworks"
color = "#6366f1"
bg = "rgba(99, 102, 241, 0.14)"
icon = "code"
description = "Core software engineering languages, web frameworks, and systems programming."

[[categories]]
name = "AI, Data & Analytics"
color = "#ec4899"
bg = "rgba(236, 72, 153, 0.14)"
icon = "sparkles"
description = "Large language models, agentic AI, machine learning, data engineering, and BI."

[[categories]]
name = "Cloud, DevOps & Hyperscale"
color = "#06b6d4"
bg = "rgba(6, 182, 212, 0.14)"
icon = "cloud"
description = "Hyperscale GPU clusters, cloud providers, Kubernetes, IaC, and SRE observability."

[[categories]]
name = "Enterprise & Industry Platforms"
color = "#f59e0b"
bg = "rgba(245, 158, 11, 0.14)"
icon = "layers"
description = "Healthcare EHR (Epic), ERP (SAP/Oracle), CRM (Salesforce), ServiceNow, and WMS."

[[categories]]
name = "Cybersecurity, Network & OT"
color = "#10b981"
bg = "rgba(16, 185, 129, 0.14)"
icon = "shield"
description = "SOC defense, IAM, GRC/audit, enterprise routing/F5, and industrial OT/robotics."

[[categories]]
name = "IT Leadership, Ops & Support"
color = "#a855f7"
bg = "rgba(168, 85, 247, 0.14)"
icon = "users"
description = "Engineering management, Agile PMO, systems administration, and technical support."

