[project]
name = "memployers"
version = "0.2.0"
description = "Build the Greater Memphis IT employers SQLite database and static GitHub Pages site."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
memployers = "memployers.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "radon>=6.0",
    "ruff>=0.8",
    "ty>=0.0.1a30",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memployers"]

# ---------------------------------------------------------------------------
# Lint & format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle, pyflakes
    "I",            # import sorting
    "B",            # bugbear
    "UP",           # pyupgrade
    "SIM",          # simplify
    "C90",          # mccabe complexity
    "RUF",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

# ---------------------------------------------------------------------------
# Tests & coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["memployers", "tools"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["tools"]

[tool.ty.src]
include = ["src", "tests", "tools"]
